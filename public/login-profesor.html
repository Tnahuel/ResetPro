<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ResetPro — Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login-profesor.css">
</head>
<body>

<header class="top">
  <a class="brand" href="index.html">
    <img src="icono.PNG" alt="ResetPro">
    <span>RESETPRO</span>
  </a>
  <a class="back" href="index.html">Volver al inicio</a>
</header>

<main class="login-wrap">
  <div class="login-card">

    <div class="role-toggle" id="roleToggle">
      <button type="button" class="role-btn active" data-role="profesor">Profesor</button>
      <button type="button" class="role-btn" data-role="admin">Administrador</button>
    </div>

    <div class="login-tag" id="loginTag">PROFESOR</div>
    <h1 id="loginTitle">Ingresá a tu cuenta</h1>
    <p class="sub" id="loginSub">Gestioná tus alumnos, horarios y rutinas.</p>

    <form id="loginForm" novalidate>
      <label for="email">Usuario o email</label>
      <input type="text" id="email" name="email" placeholder="tu@email.com" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

      <p class="error" id="loginError">Completá usuario y contraseña.</p>

      <button type="submit" class="btn-primary">Ingresar</button>
    </form>

    <div class="login-links">
      <a href="#">¿Olvidaste tu contraseña?</a>
      <a href="login-usuario.html">¿Sos usuario? Ingresá acá</a>
    </div>
  </div>
</main>

<script src="resetpro-api.js"></script>
<script src="login-profesor.js"></script>
</body>
</html>
